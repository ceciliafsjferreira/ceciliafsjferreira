<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Cecília Ferreira - Data Analyst" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="20" y="20" width="760" height="300" rx="22" fill="#0d1117" stroke="#f472b6" stroke-opacity="0.55" stroke-width="2"/>

  <!-- cantos -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <path d="M34 62 V34 H62"/>
    <path d="M738 34 H766 V62"/>
    <path d="M34 278 V306 H62"/>
    <path d="M738 306 H766 V278"/>
  </g>

  <!-- mini dashboard de dados -->
  <g>
    <!-- eixos e grade -->
    <g stroke="#2a2f45" stroke-width="1.5">
      <line x1="575" y1="70" x2="575" y2="220"/>
      <line x1="575" y1="220" x2="735" y2="220"/>
    </g>
    <g stroke="#1c2133" stroke-width="1" stroke-dasharray="3 5">
      <line x1="575" y1="100" x2="735" y2="100"/>
      <line x1="575" y1="140" x2="735" y2="140"/>
      <line x1="575" y1="180" x2="735" y2="180"/>
    </g>

    <!-- barras -->
    <rect x="585" y="170" width="20" height="50" rx="3" fill="#f472b6">
      <animate attributeName="height" values="50;60;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;160;170" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="615" y="140" width="20" height="80" rx="3" fill="#a78bfa">
      <animate attributeName="height" values="80;92;80" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;128;140" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="645" y="155" width="20" height="65" rx="3" fill="#38bdf8">
      <animate attributeName="height" values="65;75;65" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="155;145;155" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="675" y="110" width="20" height="110" rx="3" fill="#f472b6">
      <animate attributeName="height" values="110;122;110" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;98;110" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="705" y="80" width="20" height="140" rx="3" fill="#a78bfa">
      <animate attributeName="height" values="140;152;140" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;68;80" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- linha de tendência -->
    <polyline points="595,150 625,118 655,128 685,84 715,58" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0d1117" stroke="#34d399" stroke-width="2.5">
      <circle cx="595" cy="150" r="4.5"/>
      <circle cx="625" cy="118" r="4.5"/>
      <circle cx="655" cy="128" r="4.5"/>
      <circle cx="685" cy="84" r="4.5"/>
      <circle cx="715" cy="58" r="4.5"/>
    </g>

    <text x="655" y="244" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8b8fc7" text-anchor="middle" letter-spacing="2">insights.csv</text>
  </g>

  <g font-family="'Courier New', Courier, monospace">
    <text x="62" y="68" font-size="14" fill="#34d399">Welcome to GitHub ✿</text>

    <text x="62" y="128" font-size="56" font-weight="bold" fill="#f472b6" letter-spacing="3">CECÍLIA</text>
    <text x="62" y="186" font-size="56" font-weight="bold" fill="#f472b6" letter-spacing="3">FERREIRA</text>

    <text x="62" y="212" font-size="13" fill="#8b8fc7" letter-spacing="2">Data Analyst · Python · SQL · Power BI · AWS</text>

    <line x1="62" y1="226" x2="540" y2="226" stroke="#2a2f45" stroke-width="1.5"/>

    <text x="62" y="252" font-size="14" fill="#c9d1d9"><tspan fill="#34d399" font-weight="bold">Hello, World!</tspan> Transformando dados em insights.</text>

    <circle cx="68" cy="272" r="5" fill="#f472b6"/>
    <text x="82" y="277" font-size="14" fill="#c9d1d9">Logged in as user: <tspan fill="#f472b6">ceciliafsjferreira</tspan></text>

    <text x="62" y="302" font-size="14" fill="#c9d1d9">~/CeciliaRepo <tspan fill="#a78bfa">[⎇ main]</tspan></text>
    <rect x="238" y="288" width="10" height="17" fill="#f472b6">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
