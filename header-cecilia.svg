    Welcome to GitHub
  </text>
  <text x="335" y="75" fill="#ff5fb7" font-family="sans-serif" font-size="28">🐈</text>
  <text x="380" y="75" fill="#8b7cf6" font-family="monospace" font-size="24">&gt;_</text>

  <!-- Name -->
  <text x="65" y="160" fill="url(#pink)" filter="url(#glow)"
