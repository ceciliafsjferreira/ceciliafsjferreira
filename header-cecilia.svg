<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff5fb7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="1180" height="410" rx="24" fill="#0d1117" stroke="#f05ab5" stroke-width="3"/>

  <!-- Neon corner details -->
